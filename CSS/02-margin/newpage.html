<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link rel="stylesheet" href="newpage.css">
</head>
<body>
    <div class="container">
        <h1 class="logo">Google</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search Google or type a URL">
            <div class="icons">
                <span class="mic">🎤</span>
                <span class="lens">🔍</span>
            </div>
        </div>
        <div class="shortcuts">
            <div class="shortcut">
                <img src="https://www.google.com/chrome/static/images/favicons/favicon-96x96.png" alt="Web Store">
                <p>Web Store</p>
            </div>
            <div class="shortcut">
                <img src="https://www.google.com/favicon.ico" alt="GetIntoPC">
                <p>getinto pc</p>
            </div>
            <div class="shortcut">
                <div class="add">+</div>
                <p>Add shortcut</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
