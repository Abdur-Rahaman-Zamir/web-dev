<html>
<head>
    <title>Ordered and Unordered Lists</title>
</head>
<body>   
       <h1 align="center">Fruits and Vegetables</h1>
    
        <h4>Ordered List of Fruits</h4>
        <ol type="I" start ="10">
            <li>Apple</li>
            <li>Banana</li>
            <li>Cherry</li>
            <li>Date</li>
            <li>Elderberry</li>
        </ol>
    
        <h4>Unordered List of Vegetables</h4>
        <ul type ="circle">
            <li>Carrot</li>
            <li>Broccoli</li>
            <li>Spinach</li>
            <li>Potato</li>
            <li>Tomato</li>
        </ul>   

</body>  

</html>
