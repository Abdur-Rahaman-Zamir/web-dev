<!DOCTYPE html>
<html>
<head>
    <title>Ordered and Unordered Lists</title>
</head>
<body bgcolor="skyblue">

    <h1 align="center" style="color:green;">Fruits and Vegetables</h1>
<hr width="50%" align="center" size="10" color="pink"/>
    <h3 style="color:blue;">Ordered List of Fruits</h3>
    <ol type="I" start="10" style="background-color:#eaf7ea; padding:10px; width:200px; border-radius:10px;">
        <li>Apple</li>
        <li>Banana</li>
        <li>Cherry</li>
        <li>Date</li>
        <li>Elderberry</li>
    </ol>

    <h3 style="color:darkred;">Unordered List of Vegetables</h3>
    <ul type="circle" style="background-color:#fff4e6; padding:10px; width:200px; border-radius:10px;">
        <li>Carrot</li>
        <li>Broccoli</li>
        <li>Spinach</li>
        <li>Potato</li>
        <li>Tomato</li>
    </ul>
<pre> ABDUR     RAHAMAN      ZAMIR 
    ALI       AHMED        KHAN
</pre>
</body>
</html>
