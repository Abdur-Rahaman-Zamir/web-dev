<html>
<head>
    <title>Table Tag Example</title>
</head>
<body>
    <table border="1" width="300" cellspacing="0" cellpadding="10" align="center">
        <tr>
            <th>Name</th>
            <th>Class</th>
            <th>Percentage</th>
        </tr>
        <tr>
            <td>AKIF</td>
            <td>12TH</td>
            <td>89%</td>
        </tr>
        <tr>
            <td>ARSH</td>
            <td>10TH</td>
            <td>90%</td>
        </tr>
        <tr>
            <td>ZAMIR</td>
            <td>11TH</td>
            <td>99%</td>
        </tr>
    </table>
</body>
</html>
